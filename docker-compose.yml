version: '3.8'

services:
  # 1. Banco de Dados PostgreSQL + Extensão PostGIS
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: topsis-postgis
    restart: always
    environment:
      POSTGRES_DB: topsis_db
      POSTGRES_USER: topsis_user
      POSTGRES_PASSWORD: topsis_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_schema_postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - topsis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topsis_user -d topsis_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend API RESTful e Motor TOPSIS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: topsis-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: plataforma-topsis-segredo-super-seguro-2026
      DATABASE_URL: postgres://topsis_user:topsis_password@db:5432/topsis_db
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - topsis-network

  # 3. Frontend SPA (React + Vite + TailwindCSS servido por Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: topsis-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - topsis-network

networks:
  topsis-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
