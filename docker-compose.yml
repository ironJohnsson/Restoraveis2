# Plataforma de Energia Renovável com TOPSIS — implantação em 1 comando:
#
#   docker compose up -d --build
#
#   Interface web ....... http://localhost:3000
#   API ................. http://localhost:5000  (também em http://localhost:3000/api)
#   Swagger ............. http://localhost:5000/api-docs
#
# Opcional: copie .env.example para .env para definir senhas e o segredo do JWT.
services:
  # 1. Banco de Dados PostgreSQL + extensão PostGIS (acessível apenas pela rede interna)
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: topsis_db
      POSTGRES_USER: topsis_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topsis_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - topsis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topsis_user -d topsis_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 2. Backend: API RESTful e motor TOPSIS. Aplica as migrations e os dados iniciais ao subir.
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://topsis_user:${POSTGRES_PASSWORD:-topsis_password}@db:5432/topsis_db
      # Vazio = segredo aleatório gerado na primeira execução e guardado no volume backend_data
      JWT_SECRET: ${JWT_SECRET:-}
      SEED_SENHA_PADRAO: ${SEED_SENHA_PADRAO:-123456}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: 1
    volumes:
      - backend_data:/app/data
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - topsis-network

  # 3. Frontend: SPA React servida por Nginx, que também encaminha /api para o backend
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - topsis-network

networks:
  topsis-network:
    driver: bridge

volumes:
  postgres_data:
  backend_data:
