name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — testes e cobertura (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Falha se a cobertura ficar abaixo de 80% (RNF05) — limite definido no package.json
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: backend/coverage

  backend-postgres:
    name: Backend — mesma suíte no PostgreSQL + PostGIS
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: topsis_test
          POSTGRES_USER: topsis
          POSTGRES_PASSWORD: topsis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topsis -d topsis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://topsis:topsis@localhost:5432/topsis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx jest --runInBand --coverage=false
      - name: A migration do PostGIS criou a coluna geoespacial
        run: >-
          docker exec "${{ job.services.db.id }}"
          psql -U topsis -d topsis_test -v ON_ERROR_STOP=1 -c
          "SELECT nome, ST_AsText(coordenadas) FROM municipios WHERE coordenadas IS NOT NULL LIMIT 3"

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: Testes de sistema (E2E) no navegador
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-e2e
          path: |
            frontend/playwright-report
            frontend/test-results

  docker:
    name: Docker Compose — sobe em 1 comando
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: Interface, API e login respondem
        run: |
          curl -fsS http://localhost:3000/ | grep -q "Plataforma de Energia"
          curl -fsS http://localhost:3000/api/status | grep -q '"status":"online"'
          curl -fsS http://localhost:5000/api-docs.json | grep -q '"openapi"'
          curl -fsS -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@topsis.gov.br","senha":"123456"}' | grep -q '"token"'
      - name: O banco em uso é o PostgreSQL com PostGIS
        run: >-
          docker compose exec -T db psql -U topsis_user -d topsis_db -v ON_ERROR_STOP=1 -c
          "SELECT COUNT(*) AS municipios_com_geometria FROM municipios WHERE coordenadas IS NOT NULL"
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
